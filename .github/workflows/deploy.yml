name: Build and deploy UneeRooms

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: roomiq

permissions:
  id-token: write        # OIDC federated login — no publish profile, no secrets in the image
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build the image in ACR
        run: |
          az acr build \
            --registry "${{ secrets.ACR_NAME }}" \
            --image "$IMAGE:${{ github.sha }}" \
            --image "$IMAGE:latest" \
            --file Dockerfile .

      - name: Point the web app at the new image
        run: |
          az webapp config container set \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --container-image-name "${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE:${{ github.sha }}"

      - name: Wait for the health check
        run: |
          URL="https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/healthz"
          for i in $(seq 1 30); do
            if curl -fsS "$URL" > /dev/null; then echo "healthy"; exit 0; fi
            echo "waiting ($i/30)…"; sleep 10
          done
          echo "health check never went green"; exit 1
